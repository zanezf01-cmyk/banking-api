<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12151B;
    --surface: #191D25;
    --surface-2: #1F2530;
    --line: #2A303C;
    --text: #E8EAED;
    --text-dim: #8A93A3;
    --accent: #3D7DFF;
    --danger: #EF4D5E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 5px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 5px);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }

  .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 320px; max-width: 100%; padding: 32px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
  .login-card h1 { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 28px; margin: 0 0 4px; letter-spacing: 0.5px; }
  .login-card p.sub { color: var(--text-dim); font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 16px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 3px; color: var(--text); font-family: inherit; font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    margin-top: 24px; width: 100%; padding: 11px; background: var(--accent); color: #0A0E14;
    border: none; border-radius: 3px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600;
    font-size: 14px; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .error { color: var(--danger); font-size: 13px; margin-top: 14px; min-height: 16px; }

  header.top { display: flex; justify-content: flex-end; margin-bottom: 40px; }
  header.top .who { color: var(--text-dim); font-size: 13px; }
  header.top .who button { all: unset; cursor: pointer; color: var(--accent); }

  .hero { margin-bottom: 40px; }
  .hero .label { color: var(--text-dim); font-size: 13px; margin-bottom: 6px; }
  .hero .amount { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 72px; line-height: 1; letter-spacing: 0.5px; }
  .hero .meta { color: var(--text-dim); font-size: 13px; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; }
  @media (max-width: 480px) { .hero .amount { font-size: 48px; } }

  .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; margin-bottom: 40px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

  .panel-title { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }

  .bar-row { margin-bottom: 14px; }
  .bar-row .bar-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .bar-row .bar-top .amt { font-family: 'IBM Plex Mono', monospace; color: var(--text-dim); }
  .bar-track { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }

  .stat-list .stat { padding: 14px 0; border-top: 1px solid var(--line); }
  .stat-list .stat:first-child { border-top: none; }
  .stat .stat-label { font-size: 12px; color: var(--text-dim); }
  .stat .stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 18px; margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); font-weight: 500; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  td { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  td.amt { font-family: 'IBM Plex Mono', monospace; text-align: right; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; background: var(--surface-2); color: var(--text-dim); font-size: 11px; }

  .hidden { display: none; }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>Sign in</h1>
    <p class="sub">Transaction dashboard</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>
</div>

<div id="dashboard" class="wrap hidden">
  <header class="top">
    <div class="who">Signed in as <span id="whoUser"></span> &nbsp;·&nbsp; <button id="logoutBtn">Sign out</button></div>
  </header>

  <div class="hero">
    <div class="label">Total spent</div>
    <div class="amount" id="totalAmount">$0.00</div>
    <div class="meta" id="metaLine"></div>
  </div>

  <div class="grid">
    <div>
      <div class="panel-title">By category</div>
      <div id="categoryBars"></div>
    </div>
    <div>
      <div class="panel-title">At a glance</div>
      <div class="stat-list" id="statList"></div>
    </div>
  </div>

  <div class="panel-title">Transactions</div>
  <table>
    <thead>
      <tr><th>Merchant</th><th>Category</th><th style="text-align:right">Amount</th></tr>
    </thead>
    <tbody id="txnBody"></tbody>
  </table>
</div>

<script>
const API_BASE = window.location.origin;
let token = localStorage.getItem('token') || null;
let username = localStorage.getItem('username') || null;

const loginScreen = document.getElementById('loginScreen');
const dashboard = document.getElementById('dashboard');

async function login(user, pass) {
  const body = new URLSearchParams();
  body.set('username', user);
  body.set('password', pass);

  const res = await fetch(`${API_BASE}/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body,
  });

  if (!res.ok) throw new Error('Incorrect username or password');
  const data = await res.json();
  return data.access_token;
}

async function fetchJSON(path) {
  const res = await fetch(`${API_BASE}${path}`, {
    headers: { 'Authorization': `Bearer ${token}` },
  });
  if (res.status === 401) {
    signOut();
    throw new Error('Session expired, please sign in again');
  }
  return res.json();
}

function money(n) {
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
}

async function loadDashboard() {
  const [summary, transactions] = await Promise.all([
    fetchJSON('/transactions/summary'),
    fetchJSON('/transactions'),
  ]);

  document.getElementById('whoUser').textContent = username;
  document.getElementById('totalAmount').textContent = money(summary.total_spent);
  document.getElementById('metaLine').textContent =
    `${summary.transaction_count} transaction${summary.transaction_count === 1 ? '' : 's'}`;

  const categoryEntries = Object.entries(summary.by_category).sort((a, b) => b[1] - a[1]);
  const maxAmount = Math.max(...categoryEntries.map(([, amt]) => amt), 1);

  document.getElementById('categoryBars').innerHTML = categoryEntries.map(([category, amount]) => `
    <div class="bar-row">
      <div class="bar-top"><span>${category}</span><span class="amt">${money(amount)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(amount / maxAmount) * 100}%"></div></div>
    </div>
  `).join('');

  const biggest = transactions.reduce((max, t) => t.amount > (max?.amount ?? 0) ? t : max, null);
  document.getElementById('statList').innerHTML = `
    <div class="stat"><div class="stat-label">Categories</div><div class="stat-value">${categoryEntries.length}</div></div>
    <div class="stat"><div class="stat-label">Largest single expense</div><div class="stat-value">${biggest ? money(biggest.amount) : '—'}</div></div>
    <div class="stat"><div class="stat-label">Average transaction</div><div class="stat-value">${money(summary.transaction_count ? summary.total_spent / summary.transaction_count : 0)}</div></div>
  `;

  document.getElementById('txnBody').innerHTML = [...transactions].reverse().map(t => `
    <tr>
      <td>${t.merchant}</td>
      <td><span class="tag">${t.category}</span></td>
      <td class="amt">${money(t.amount)}</td>
    </tr>
  `).join('');
}

function showDashboard() {
  loginScreen.classList.add('hidden');
  dashboard.classList.remove('hidden');
  loadDashboard().catch(err => console.error(err));
}

function signOut() {
  token = null;
  username = null;
  localStorage.removeItem('token');
  localStorage.removeItem('username');
  dashboard.classList.add('hidden');
  loginScreen.classList.remove('hidden');
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const user = document.getElementById('username').value;
  const pass = document.getElementById('password').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';

  try {
    token = await login(user, pass);
    username = user;
    localStorage.setItem('token', token);
    localStorage.setItem('username', username);
    showDashboard();
  } catch (err) {
    errorEl.textContent = err.message;
  }
});

document.getElementById('logoutBtn').addEventListener('click', signOut);

if (token && username) {
  showDashboard();
}
</script>
</body>
</html>
